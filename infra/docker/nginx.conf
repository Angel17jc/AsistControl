map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 2m;

  # Who the client is: nginx is the edge, so $remote_addr is the truth and X-Forwarded-For is
  # REPLACED with it below, never appended to. Appending would pass on whatever a client wrote
  # in that header, and the API (which trusts private-network proxies) would believe it: one
  # forged header per attempt and the login rate limit never triggers.
  # Behind a tunnel or another proxy, declare it here so $remote_addr becomes the real client:
  # a file in real-ip.d/ with set_real_ip_from <proxy> and real_ip_header (docs/security.md).
  include /etc/nginx/real-ip.d/*.conf;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location = /health {
    proxy_pass http://api:3000/health;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: client-side routes resolve to index.html (never cached).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
