version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Upgrade framework families together; they are released in lockstep.
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      testing:
        patterns: ['jest', 'ts-jest', '@types/jest', 'vitest', '@testing-library/*', 'supertest']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-*', 'prettier']
    ignore:
      # Types must match the Node.js runtime (22 LTS); bump together with the Node version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Framework majors are planned migrations (ADR 0001), not automatic bumps.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR (and one CI run) for all workflow actions instead of one per action.
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
    ignore:
      # The runtime follows the Node.js LTS line used by CI and .nvmrc; changed deliberately.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'build(deps)'
