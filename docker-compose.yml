# AsistControl — local / demo stack.
#   docker compose up -d                 → postgres + api + web (http://localhost:8080)
#   docker compose --profile tools up -d → also pgAdmin (http://localhost:5050)
#
# Every value can be overridden from a .env file next to this file (see .env.example).
# The defaults are for a laptop demo ONLY. For production set NODE_ENV=production and real
# secrets: the API refuses to boot in production with placeholder secrets.

name: asistcontrol

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  DATABASE_URL: postgresql://${POSTGRES_USER:-asistcontrol}:${POSTGRES_PASSWORD:-asistcontrol}@postgres:5432/${POSTGRES_DB:-asistcontrol}?schema=public
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-local-access-secret-0123456789abcdef}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-local-refresh-secret-0123456789abcdef}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DEVICE_SECRETS_KEY: ${DEVICE_SECRETS_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  DEVICE_SYNC_INTERVAL_SECONDS: ${DEVICE_SYNC_INTERVAL_SECONDS:-300}
  ENABLE_MOCK_DEVICES: ${ENABLE_MOCK_DEVICES:-true}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Guayaquil}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asistcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asistcontrol}
      POSTGRES_DB: ${POSTGRES_DB:-asistcontrol}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: asistcontrol/api:local
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: asistcontrol/web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'

  # Optional DB browser, opt-in: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@asistcontrol.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-asistcontrol}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    depends_on:
      - postgres

volumes:
  pgdata:
